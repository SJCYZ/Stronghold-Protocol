services:
  stronghold:
    image: stronghold-protocol:1b86f438-local
    restart: unless-stopped
    stop_grace_period: 70s
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "1"
      SP_REDIS_URL: redis://redis:6379/0
      SP_BOT_REHEARSAL: host
      SP_PLUGIN_SCRIPTS: sandbox
      SP_STUDIO_HOSTS: ${SP_STUDIO_HOSTS:-}
      SP_ASSETS_CDN: ${SP_ASSETS_CDN:-}
      SP_DATA_CDN: ${SP_DATA_CDN:-}
    ports:
      - "127.0.0.1:3080:3000"
    volumes:
      - ../../public/assets:/app/public/assets:ro
      - ../../public/fonts:/app/public/fonts:ro
      - ./runtime/assets.json:/app/data/assets.json:ro
      - ./runtime/local-assets.json:/app/data/local-assets.json:ro
      - ./runtime/local-fx.json:/app/data/local-fx.json:ro
      - ./runtime/skins.json:/app/data/skins.json:ro
      - ./runtime/asset-hashes.json:/app/data/asset-hashes.json:ro
      - ./runtime/resource-packs.json:/app/data/resource-packs.json:ro
      - ./runtime/plugins:/app/plugins
      - ../../public/resource-packs:/app/public/resource-packs:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis-data:
