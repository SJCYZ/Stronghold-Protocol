services:
  stronghold:
    image: stronghold-protocol:e01036ae
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        FETCH_ASSETS: "1"
    restart: unless-stopped
    stop_grace_period: 70s
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "1"
      SP_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:3080:3000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis-data:
